
name: Build Taiga Flock from source ZIP

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taiga-flock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ForgeGradle build (Minecraft 1.20.1)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show commit and locate source ZIP
        shell: bash
        run: |
          echo "Building commit: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF"
          echo "Repository root:"
          ls -la

          ZIP_PATH="$(find . -type f -name 'taiga-flock-source.zip' -not -path './.git/*' -print -quit)"

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::Source ZIP was not found in this commit."
            echo "Files found in the repository:"
            find . -maxdepth 5 -type f -not -path './.git/*' -print | sort
            exit 1
          fi

          echo "Found source ZIP at: $ZIP_PATH"
          echo "SOURCE_ZIP=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract source project
        run: unzip -q "$SOURCE_ZIP" -d source

      - name: Validate JSON resources and texture references
        working-directory: source/taiga-flock
        run: python3 scripts/validate_resources.py

      - name: Build mod
        working-directory: source/taiga-flock
        run: gradle --no-daemon build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: taiga-flock-jar
          path: source/taiga-flock/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
